name: contact
description: "Application Flutter de quiz connectée à une API Laravel."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  animated_bottom_navigation_bar: any
  flutter_map: any
  geolocator: any
  http: any
  image_picker: any
  latlong2: any
  shared_preferences: any
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/themes/
